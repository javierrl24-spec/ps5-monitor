name: Ofertones PS5
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      probar:
        description: 'ID de un post para mandar de prueba (0 = normal)'
        default: '0'
      canal:
        description: 'canal del post de prueba'
        default: 'OfertonesMexico'
concurrency:
  group: ofertones
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Monitor
        shell: powershell
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          PROBAR: ${{ github.event.inputs.probar }}
          CANAL: ${{ github.event.inputs.canal }}
        run: |
          if ($env:PROBAR -and $env:PROBAR -ne '0') { .\monitor-ofertones.ps1 -Probar ([int]$env:PROBAR) -De $env:CANAL } else { .\monitor-ofertones.ps1 }
      - name: Guardar estado
        shell: bash
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add ofertones-ultimo.txt ofertones-estado.json ofertones-enviados.json
          git diff --cached --quiet || (git commit -m "estado ofertones" && git pull --rebase -q && git push -q)