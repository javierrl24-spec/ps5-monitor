name: Ofertones PS5
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      probar:
        description: 'ID de un post para mandar de prueba (0 = normal)'
        default: '0'
      canal:
        description: 'canal del post de prueba'
        default: 'OfertonesMexico'
      bucle:
        description: 'minutos que revisa sin parar (345 = normal)'
        default: '175'
concurrency:
  group: ofertones
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 195
    steps:
      - uses: actions/checkout@v4
      - name: Identidad git
        shell: bash
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
      - name: Monitor
        shell: powershell
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          PROBAR: ${{ github.event.inputs.probar }}
          CANAL: ${{ github.event.inputs.canal }}
          GH_TOKEN: ${{ github.token }}
          BUCLE: ${{ github.event.inputs.bucle }}
        run: |
          if ($env:PROBAR -and $env:PROBAR -ne '0') { .\monitor-ofertones.ps1 -Probar ([int]$env:PROBAR) -De $env:CANAL }
          else { $b = 175; if ($env:BUCLE) { $b = [int]$env:BUCLE }; .\supervisor-ofertones.ps1 -Minutos $b }