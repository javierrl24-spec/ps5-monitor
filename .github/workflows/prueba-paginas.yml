name: Prueba paginas
on: workflow_dispatch
jobs:
  t:
    runs-on: windows-latest
    steps:
      - shell: powershell
        run: |
          $ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          $u = [ordered]@{
           "Amazon Digital"="https://www.amazon.com.mx/dp/B0FTP523RH"
           "Amazon Disco"="https://www.amazon.com.mx/dp/B0FTNL3B9F"
           "MercadoLibre"="https://listado.mercadolibre.com.mx/consolas-videojuegos/consolas/playstation-5_NoIndex_True_ITEM*CONDITION_2230284"
           "Walmart"="https://www.walmart.com.mx/browse/videojuegos/play-station-5/consolas-ps5/264999_970024_970025"
           "Bodega"="https://www.bodegaaurrera.com.mx/browse/videojuegos/playstation-5/consolas-ps5/264999_970024_970025"
           "Sams"="https://www.sams.com.mx/browse/juguetes-y-videojuegos/videojuegos/play-station/1850006_1850008_1850011"
           "Costco"="https://www.costco.com.mx/search?text=playstation%205%20consola"
           "Soriana"="https://www.soriana.com/buscar?q=consola%20playstation%205"
           "Coppel"="https://www.coppel.com/SearchDisplay?searchTerm=consola%20playstation%205"
           "Sanborns"="https://www.sanborns.com.mx/resultados?query=consola%20playstation%205"
           "OfficeDepot"="https://www.officedepot.com.mx/officedepot/en/search/?text=consola+playstation+5"
           "Intercompras"="https://intercompras.com/c/consolas-2519"
          }
          foreach ($k in $u.Keys) {
            try { $r = Invoke-WebRequest -Uri $u[$k] -UseBasicParsing -UserAgent $ua -TimeoutSec 25 -Headers @{ "Accept-Language"="es-MX" }; $c=$r.Content; $st=$r.StatusCode }
            catch { $st = [int]$_.Exception.Response.StatusCode; $c = "" }
            $bot = $c -match '(?i)captcha|robot|incapsula|px-captcha|verify you|mant[eé]n presionado'
            $precio = [regex]::Matches($c,'\$\s?\d{1,2},\d{3}').Count
            "{0,-14} HTTP {1} len {2} bot={3} precios_en_html={4}" -f $k,$st,$c.Length,$bot,$precio
          }